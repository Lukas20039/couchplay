# Speicher knapp halten (Build-Host mit wenig RAM, parallele Agents).
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Standard-Server der TV-App (Emulator: 10.0.2.2 = Host-Rechner).
# Überschreiben: ./gradlew assembleRelease -Pcouchplay.serverUrl=https://play.example.org
couchplay.serverUrl=http://10.0.2.2:8080
